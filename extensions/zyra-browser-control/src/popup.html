<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zyra Browser Control</title>
  <style>
    :root { color-scheme: dark; font: 13px/1.4 system-ui, sans-serif; background:#111827; color:#e5e7eb }
    body { width:290px; margin:0; padding:14px }
    h1 { font-size:14px; margin:0 0 4px } p { color:#9ca3af; margin:0 0 12px }
    label { display:block; font-size:11px; color:#cbd5e1; margin-top:8px }
    input { box-sizing:border-box; width:100%; margin-top:4px; padding:7px 8px; border:1px solid #374151; border-radius:6px; background:#0b1220; color:#fff }
    .row { display:flex; gap:7px; margin-top:10px } button { flex:1; border:1px solid #475569; border-radius:6px; padding:7px; background:#1e293b; color:#f8fafc; cursor:pointer } button.primary { background:#6d28d9; border-color:#7c3aed } button:disabled { opacity:.45 }
    #status { min-height:18px; margin-top:10px; font-size:11px; color:#a7f3d0 }
    .warning { color:#fcd34d; font-size:10px; margin-top:10px }
  </style>
</head>
<body>
  <h1>Zyra Browser Control</h1>
  <p>Pair locally, then grant only the active tab.</p>
  <label>Loopback port<input id="port" inputmode="numeric" maxlength="5" autocomplete="off"></label>
  <label>Eight-digit code<input id="code" inputmode="numeric" maxlength="8" autocomplete="one-time-code"></label>
  <div class="row"><button id="pair" class="primary">Pair Zyra</button><button id="disconnect">Disconnect</button></div>
  <div class="row"><button id="grant" class="primary">Grant this tab</button></div>
  <div id="status" role="status"></div>
  <div class="warning">Chrome internal, settings, extension, payment, and password-manager pages are never available.</div>
  <script type="module" src="popup.js"></script>
</body>
</html>
