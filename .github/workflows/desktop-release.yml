name: One-time verified 0.7.0 draft transfer
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: one-time-zyra-0.7.0-transfer
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'elsondev2/zyra'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the frozen validated source
        uses: actions/checkout@v4
        with:
          ref: 3d3c045014be9b602a0057a9f89b53cf229cb7c7
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify source run and download its immutable bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess
          result = subprocess.run(['gh','run','view','37146844708','--repo','elsondev2/zyra','--json','status,conclusion,headSha,jobs'],check=True,capture_output=True,text=True)
          run = json.loads(result.stdout)
          assert run['status']=='completed' and run['conclusion']=='success' and run['headSha']=='3d3c045014be9b602a0057a9f89b53cf229cb7c7'
          assert len(run['jobs'])==6 and all(job['conclusion']=='success' for job in run['jobs'])
          subprocess.run(['gh','run','download','37146844708','--repo','elsondev2/zyra','--name','zyra-desktop-0.7.0-all-platforms','--dir','bundle'],check=True)
          PY
      - name: Upload exact missing assets and independently validate draft readback
        env:
          GH_TOKEN: ${{ secrets.ZYRA_RELEASE_UPLOAD_0_7_0 }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          expected = json.loads('[{"name":"SHA256SUMS","size":1351,"sha256":"c995fb7077c4316bbdbd8d53d7fb4d649c124421f5f267f538da18cc23bf5803"},{"name":"Zyra-Desktop-0.7.0-Linux-x64.AppImage","size":329407982,"sha256":"3ffd3ab62e273d0b0ce495d92b5e03dac62a44e6d584052ca4ed862b64a2ca91"},{"name":"Zyra-Desktop-0.7.0-Linux-x64.deb","size":256203888,"sha256":"d7d343f0fc9b7c245befd86f9b50ace85e6334d91ca4b5a081f67093e1f924f1"},{"name":"Zyra-Desktop-0.7.0-Windows-x64.exe","size":350338683,"sha256":"a4c9dcf5cfd0b46f18bf76ed4092776dac29fa390ce9099347df840d715160a3"},{"name":"Zyra-Desktop-0.7.0-Windows-x64.exe.blockmap","size":355936,"sha256":"2fe4aa85e7734eed94a171dec3eec6912373e468976deee416cd46f724163676"},{"name":"Zyra-Desktop-0.7.0-macOS-universal.dmg","size":419331706,"sha256":"7741e0c5f6260c90aa80fb490e5f6ce6729c386ed83ea785ef854cdac93612a2"},{"name":"Zyra-Desktop-0.7.0-macOS-universal.zip","size":427627377,"sha256":"ee14427719e393088f11878635bcd694330ffb07d5f7954deceb1fd456fa3415"},{"name":"Zyra-Desktop-0.7.0-macOS-universal.zip.blockmap","size":443346,"sha256":"af803d47ede8d47a2ba323041200d80df213ff9b329b7bc42ed8cf9f892c306c"},{"name":"Zyra-TUI-0.7.0-linux-x64","size":119085374,"sha256":"21b2a1a7349a8dc461db1a4c70a2630953635646a6fe13b507866460239de18a"},{"name":"Zyra-TUI-0.7.0-macos-arm64","size":77134048,"sha256":"12ce9f0f40fca9555430575fe10a5224b1a839f4a84c2c56d2aa6478540cc069"},{"name":"Zyra-TUI-0.7.0-macos-x64","size":81905904,"sha256":"2f64db5b6c95d2c6432796c8ea620259393dcdc1c2cee393e38c1f8a4218da33"},{"name":"Zyra-TUI-0.7.0-windows-x64.exe","size":130578944,"sha256":"16b46b6640789911a686deba52ffcb7b7c934b5107df5e5d07cc351896a85655"},{"name":"latest-linux.yml","size":559,"sha256":"6f40103ac20dc0e3c38520a93d2340c431adbdd154a8b47889283d4db75c3882"},{"name":"latest-mac.yml","size":542,"sha256":"e60f4301a2374388817262d16fad993834c88aabc539cf4893171ef15a151f8f"},{"name":"latest.yml","size":365,"sha256":"37e5696ffe09e268df5f7bd840ba3216e4237076447c28e09c5403454fd7e4f1"}]')
          sha = "3d3c045014be9b602a0057a9f89b53cf229cb7c7"
          def gh(args):
              result = subprocess.run(["gh", *args], capture_output=True, text=True, timeout=1200)
              assert result.returncode == 0, "GitHub transfer operation failed"
              return result.stdout.strip()
          assert gh(["api", "user", "--jq", ".login"]) == "justelson"
          assert gh(["api", "repos/justelson/zyra/git/ref/tags/v0.7.0", "--jq", ".object.sha"]) == sha
          assert gh(["api", "repos/justelson/zyra/commits/master", "--jq", ".sha"]) == sha
          def verify(directory):
              files = sorted(Path(directory).iterdir(), key=lambda f: f.name)
              assert len(files) == 15 and all(file.is_file() for file in files)
              assets = []
              for file in files:
                  with file.open("rb") as stream:
                      digest = hashlib.file_digest(stream, "sha256").hexdigest()
                  assets.append({"name":file.name,"size":file.stat().st_size,"sha256":digest})
              assert assets == expected, "Asset bytes differ from exact locally validated build"
              subprocess.run(["node", "desktop/scripts/release/validate-release-assets.mjs", "--platform=all", "--version=0.7.0", "--dir="+directory, "--checksums=true", "--exact=true"], check=True)
              return assets
          verify("bundle")
          draft = json.loads(gh(["api", "repos/justelson/zyra/releases/402676833"]))
          assert draft["draft"] and not draft["prerelease"] and draft["tag_name"] == "v0.7.0" and draft["target_commitish"] == sha
          existing = {asset["name"]:asset for asset in draft["assets"]}
          assert set(existing).issubset({asset["name"] for asset in expected})
          missing = []
          for asset in expected:
              if asset["name"] not in existing:
                  missing.append(str(Path("bundle") / asset["name"]))
              else:
                  remote = existing[asset["name"]]
                  assert remote["state"] == "uploaded" and remote["size"] == asset["size"] and remote["digest"] == "sha256:"+asset["sha256"], "Existing draft asset differs; no clobber permitted"
          if missing:
              gh(["release", "upload", "v0.7.0", *missing, "--repo", "justelson/zyra"])
          Path("readback").mkdir()
          gh(["release", "download", "v0.7.0", "--repo", "justelson/zyra", "--dir", "readback"])
          assets = verify("readback")
          draft = json.loads(gh(["api", "repos/justelson/zyra/releases/402676833"]))
          assert draft["draft"] and len(draft["assets"]) == 15 and draft["target_commitish"] == sha
          output = Path("cloud-proof")
          output.mkdir()
          (output / "owner-draft-metadata.json").write_text(json.dumps(draft,indent=2))
          (output / "remote-byte-verification.json").write_text(json.dumps({"sha":sha,"sourceRun":"37146844708","ownerDraftId":draft["id"],"remoteValidated":True,"assets":assets},indent=2))
          print("All 15 owner draft assets independently downloaded and hash-validated. Draft remains unpublished.")
          PY
      - name: Retain independent byte verification
        uses: actions/upload-artifact@v4
        with:
          name: owner-0.7.0-independent-readback-proof
          path: cloud-proof/
          if-no-files-found: error
          retention-days: 30
