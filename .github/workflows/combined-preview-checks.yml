name: Combined Preview media checks
run-name: Media check ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        type: string
        required: true
permissions:
  contents: read
jobs:
  media:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      ZYRA_TEST_SOFTWARE_RENDERING: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: justelson/zyra
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify exact source
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if ($env:SOURCE_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'Exact source required' }
          if ((git rev-parse HEAD) -ne $env:SOURCE_SHA) { throw 'Wrong source' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix desktop ci --no-audit --no-fund
      - name: Verify scroll with actual player CSS
        run: node desktop/scripts/benchmark-visualization-scroll.mjs --verify media-scroll.json
      - name: Verify native process and mobile startup ownership
        run: npm --prefix desktop run test:mobile-startup
      - name: Check complete Desktop types
        run: npm --prefix desktop run typecheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-check-${{ github.run_id }}
          path: media-scroll.json
          if-no-files-found: ignore
          retention-days: 3
